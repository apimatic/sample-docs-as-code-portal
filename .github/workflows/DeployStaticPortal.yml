name: Deploy Static Portal

on:
  workflow_dispatch:
  push:
    branches:
      - v2

jobs:
  generate-portal:
    runs-on: ubuntu-latest

    env:
      PORTAL_DIR: ${{ github.workspace }}/static-portal

    steps:
      - uses: actions/checkout@v4
        name: Checkout repo

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Version 2 of the CLI builds the portal on the runner and needs Node 22.12 or newer.
          node-version: "22"

      - name: Generate Portal
        run: npx @apimatic/cli@2 portal generate --auth-key="${{ secrets.API_KEY }}" --destination="${{ env.PORTAL_DIR }}"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: static-portal
          path: ${{ env.PORTAL_DIR }}

      # The master branch deploys its artifact to Netlify. This branch only publishes the
      # artifact, so that trying it out never overwrites the live sample portal.
